name: CI

on: [ "push", "pull_request", "workflow_dispatch" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - uses: actions/setup-node@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    - run: |
        sudo apt-get update
        sudo apt-get install aapt adb apksigner zipalign expect

    - name: Install python dependencies
      run: |
        pip install -r requirements.txt

    - name: Build script in dev mode
      run: |
        npm install
        npm run build:dev

    - name: Download apktool
      run: |
        wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
        wget -O apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
        chmod +x apktool
        sudo mv apktool.jar /usr/local/bin/apktool.jar
        sudo mv apktool /usr/local/bin/apktool

    - name: Download Among Us APK
      run: |
        mkdir data
        wget -O data/AmongUs.apk https://github.com/astra2dev/SuperSussy/releases/latest/download/AmongUs.apk

    - name: Inject script into APK
      run: |
        chmod +x tools/inject_script.sh
        tools/inject_script.sh
        mv data/AmongUs.objection.apk data/MalumMenu.apk

    - name: Upload script artifact
      uses: actions/upload-artifact@v7
      with:
        path: dist/agent.js
        archive: false

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        path: data/MalumMenu.apk
        archive: false
